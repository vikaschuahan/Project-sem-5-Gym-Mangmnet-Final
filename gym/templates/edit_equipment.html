{% extends 'navigation.html' %}

{% block body %}
<style>

.card {
    background: #ffffff !important;
    backdrop-filter: blur(16px) !important;
    -webkit-backdrop-filter: blur(16px) !important;
    border: 1px solid #e2e8f0 !important;
    border-radius: 20px !important;
    box-shadow: 0 15px 35px -10px rgba(0, 0, 0, 0.5) !important;
}
.form-label { color: #64748b !important; font-weight: 600; font-size: 0.85rem; }
.form-control, select.form-control, input.form-control, textarea.form-control {
    background: #f8fafc !important;
    border: 1px solid #cbd5e1 !important;
    color: #0f172a !important;
    border-radius: 10px !important;
    padding: 10px 14px !important;
}
.form-control:focus {
    border-color: #22c55e !important;
    box-shadow: 0 0 0 3px rgba(34,197,94,0.15) !important;
}
option { background: #ffffff !important; color: #0f172a !important; }
h3 { color: #0f172a !important; font-weight: 800 !important; margin-bottom: 24px !important; }
.btn-success {
    background: #22c55e !important;
    border: none !important;
    border-radius: 8px !important;
    font-weight: 600 !important;
    color: #0f172a !important;
}
.btn-secondary {
    background: #f1f5f9 !important;
    border: 1px solid #cbd5e1 !important;
    color: #64748b !important;
    border-radius: 8px !important;
    font-weight: 600 !important;
}
</style>
<div class="container py-4">
    <div class="card p-4">
        <h3 class="text-center">Edit Equipment</h3>
        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label">Equipment Name</label>
                <input type="text" name="name" class="form-control" value="{{ equipment.name }}" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Category</label>
                <input type="text" name="category" class="form-control" value="{{ equipment.category }}">
            </div>
            <div class="mb-3">
                <label class="form-label">Quantity</label>
                <input type="number" name="quantity" class="form-control" value="{{ equipment.quantity }}">
            </div>
            <div class="mb-3">
                <label class="form-label">Price</label>
                <input type="text" name="price" class="form-control" value="{{ equipment.price }}">
            </div>
            <div class="mb-3">
                <label class="form-label">Unit</label>
                <input type="text" name="unit" class="form-control" value="{{ equipment.unit }}">
            </div>
            <div class="mb-3">
                <label class="form-label">Purchase Date</label>
                <input type="date" name="date" class="form-control" value="{{ equipment.date }}">
            </div>
            <div class="mb-3">
                <label class="form-label">Condition</label>
                <select name="condition" class="form-control">
                    <option value="new" {% if equipment.condition == 'new' %}selected{% endif %}>New</option>
                    <option value="used" {% if equipment.condition == 'used' %}selected{% endif %}>Used</option>
                    <option value="refurbished" {% if equipment.condition == 'refurbished' %}selected{% endif %}>Refurbished</option>
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label">Description / Notes</label>
                <textarea name="desc" class="form-control">{{ equipment.description }}</textarea>
            </div>
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-success">Save Changes</button>
                <a href="{% url 'view_equipment' %}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
