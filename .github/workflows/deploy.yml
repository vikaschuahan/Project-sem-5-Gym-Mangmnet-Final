# CI/CD Pipeline for Gym Management System
# Triggers on every push to the `main` branch.
#
# Required GitHub Secrets (Settings → Secrets and variables → Actions):
#   KUBE_CONFIG    – base64-encoded kubeconfig for your cluster
#                    (cat ~/.kube/config | base64 -w 0)
#   SECRET_KEY     – Django SECRET_KEY for production
#   DATABASE_URL   – postgres://user:pass@host:5432/db
#
# The Docker image is pushed to GitHub Container Registry (ghcr.io).
# No Docker Hub account needed.

name: Build → Push → Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}   # e.g. your-username/GymManagmentSystem

jobs:
  # ──────────────────────────────────────────
  # 1. Run Django tests
  # ──────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Django system check
        run: |
          export DJANGO_SETTINGS_MODULE=GMS.settings
          export SECRET_KEY=ci-test-secret-key
          export DEBUG=True
          python manage.py check

      - name: Run tests
        run: |
          export DJANGO_SETTINGS_MODULE=GMS.settings
          export SECRET_KEY=ci-test-secret-key
          export DEBUG=True
          python manage.py test gym

  # ──────────────────────────────────────────
  # 2. Build & push Docker image to ghcr.io
  # ──────────────────────────────────────────
  build-push:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (tags / labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ──────────────────────────────────────────
  # 3. Deploy to Kubernetes
  # ──────────────────────────────────────────
  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: "latest"

      - name: Configure kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Create namespace (idempotent)
        run: kubectl apply -f k8s/namespace.yaml

      - name: Apply ConfigMap
        run: kubectl apply -f k8s/configmap.yaml

      - name: Create / update Django secret
        run: |
          kubectl create secret generic gym-secret \
            --namespace=gym-management \
            --from-literal=SECRET_KEY="${{ secrets.SECRET_KEY }}" \
            --from-literal=DATABASE_URL="${{ secrets.DATABASE_URL }}" \
            --from-literal=DATABASE_USER="gymuser" \
            --from-literal=DATABASE_PASSWORD="gympassword" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Create ghcr.io pull secret
        run: |
          kubectl create secret docker-registry ghcr-secret \
            --namespace=gym-management \
            --docker-server=ghcr.io \
            --docker-username=${{ github.actor }} \
            --docker-password=${{ secrets.GITHUB_TOKEN }} \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy PostgreSQL
        run: kubectl apply -f k8s/postgres.yaml

      - name: Update image tag in deployment
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
          sed -i "s|image: ghcr.io/YOUR_GITHUB_USERNAME/gym-management:latest|image: ${IMAGE}|g" k8s/deployment.yaml

      - name: Deploy Django app
        run: kubectl apply -f k8s/deployment.yaml

      - name: Apply Service and Ingress
        run: |
          kubectl apply -f k8s/service.yaml
          kubectl apply -f k8s/ingress.yaml

      - name: Wait for rollout
        run: kubectl rollout status deployment/gym-web -n gym-management --timeout=120s
